// Nullpath product preferences. Applied after LibreWolf's upstream defaults.
defaultPref("nullpath.aboutMenu.checkVersion", false);
defaultPref("nullpath.aboutMenu.versionCheckGitlabUrl", "");
defaultPref("app.update.url.manual", "https://github.com/Kayyo321/nullpath/releases");
defaultPref("app.update.url.details", "https://github.com/Kayyo321/nullpath/releases");
defaultPref("app.releaseNotesURL", "https://github.com/Kayyo321/nullpath/releases");
defaultPref("app.support.baseURL", "https://github.com/Kayyo321/nullpath/issues");
defaultPref("nullpath.eme.warning.infoURL", "https://github.com/Kayyo321/nullpath/issues");

// ---------------------------------------------------------------------------
// I2P router control (docs/nullpath/I2P-ROUTER-TOGGLE.md)

// Vertical tree tabs are the default layout (§10). sidebar.verticalTabs is
// switched on once after the first window opens (NullpathGlue), not here:
// a default of true makes Firefox's first-run toolbar layout scramble the
// navigation bar.
defaultPref("sidebar.revamp", true);

// Firefox's built-in VPN is a Mozilla proxy service: off in every profile.
lockPref("browser.ipProtection.enabled", false);

// Fail-closed from the first instant: autoconfig can't tell profiles apart,
// so every profile starts behind the I2P proxy with local DNS off. The
// Direct web profile undoes this in its own user.js, and the I2P profiles
// lock these (and the rest of §8.2) with the real endpoint at startup.
defaultPref("network.proxy.type", 1);
defaultPref("network.proxy.http", "127.0.0.1");
defaultPref("network.proxy.http_port", 14444);
defaultPref("network.proxy.ssl", "127.0.0.1");
defaultPref("network.proxy.ssl_port", 14444);
defaultPref("network.proxy.share_proxy_settings", true);
defaultPref("network.proxy.no_proxies_on", "");
defaultPref("network.proxy.allow_hijacking_localhost", true);
defaultPref("network.proxy.failover_direct", false);
defaultPref("network.dns.disabled", true);
defaultPref("network.captive-portal-service.enabled", false);
defaultPref("network.connectivity-service.enabled", false);


// Test target for "Test outproxy" (§3.5). Shown to the user before use.
defaultPref("nullpath.i2p.outproxy.testURL", "https://github.com/Kayyo321/nullpath");
